<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificado Agile | Santander Universidades</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #172235;
      --text: #f8fafc;
      --muted: #a8b3c7;
      --accent: #e11d48;
      --line: rgba(255, 255, 255, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      padding: 32px 18px;
    }

    main {
      width: min(760px, 100%);
      border: 1px solid var(--line);
      background: var(--panel);
      padding: clamp(28px, 5vw, 56px);
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
    }

    dl {
      display: grid;
      gap: 18px;
      margin: 36px 0 0;
    }

    div {
      border-top: 1px solid var(--line);
      padding-top: 18px;
    }

    dt {
      color: var(--muted);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    dd {
      margin: 8px 0 0;
      font-size: 1.1rem;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Santander Universidades</p>
    <h1>Metodologías Agile</h1>
    <dl>
      <div>
        <dt>Periodo</dt>
        <dd>2022 – 2023</dd>
      </div>
      <div>
        <dt>Programa</dt>
        <dd>Metodologías Agile (Scrum / Kanban)</dd>
      </div>
      <div>
        <dt>Institución</dt>
        <dd>Santander Universidades</dd>
      </div>
    </dl>
  </main>
</body>

</html>
